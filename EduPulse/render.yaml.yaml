databases:
  - name: edupulse-db
    plan: free
    databaseName: edupulse
    user: edupulse

services:
  - type: web
    name: edupulse
    runtime: node
    plan: free
    buildCommand: npm --prefix server install && npm --prefix client install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: edupulse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SIGNUP_CODE
        sync: false
      - key: AUTO_SEED
        value: "true"
